dataset:
  name: "pop_qa"  # Options: fact_score, hotpot_qa, pop_qa, medlf_qa
  query_size: 500
  wiki_db_file: "enwiki-20230401.db"
  
  
# Index configuration
index:
  delete_existing: false
  embedding_model: "text-embedding-3-large"
  # Truncation strategies by dataset
  truncation_config:  # TODO
    strategy: "fixed_length"  # false
    truncate_by: null  # "\n"
    chunk_size: 2000
    chunk_overlap: 25


# RAG configuration
rag:
  retrival_topk: 10
  retrival_threshold: 0.3
  response_model: "gpt-4o-mini" 
  response_temperature: 0.7
  fact_generation_model: "gpt-4o-mini"  


# Research retrieval configuration
retrieval:
  strategy: "single_hop"  # Options: single_hop, multi_hop
  top_k: 10
  threshold: 0.3

  multi_hop:
    max_hops: 3
    accumulate_documents: true
    stop_if_no_new_documents: true

    query_rewriter:
      provider: "openai"
      model: "gpt-4o-mini"
      temperature: 0.0
      max_documents: 5
      max_chars_per_document: 1200


# Prediction configuration
conformal_prediction:
  aggregation_strategy: "mean"
  scoring_strategy: "product"
  claim_verification_model: "gpt-4o-mini"  # "gpt-4o-mini" 
  split_conformal: true
  conformal_alphas:
    start: 0.05
    end: 0.45
    step: 0.05
  a_value: 1.0

