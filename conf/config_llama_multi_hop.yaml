experiment:
  seed: 42
  runs: 1000


dataset:
  name: "pop_qa"  # Options: fact_score, hotpot_qa, pop_qa, medlf_qa
  query_size: 500
  wiki_db_file: "enwiki-20230401.db"


index:
  delete_existing: false

  truncation_config:
    strategy: "fixed_length"
    truncate_by: null
    chunk_size: 2000
    chunk_overlap: 25


models:
  generator:
    provider: "huggingface"
    name: "meta-llama/Llama-3.1-8B-Instruct"
    temperature: 0.7

  claim_decomposer:
    provider: "huggingface"
    name: "meta-llama/Llama-3.1-8B-Instruct"

  claim_verifier:
    provider: "huggingface"
    name: "meta-llama/Llama-3.1-8B-Instruct"

  frequency_scorer:
    provider: "huggingface"
    name: "meta-llama/Llama-3.1-8B-Instruct"

  # Keep the retrieval embedding space fixed across GPT/Llama conditions.
  embedding:
    provider: "openai"
    name: "text-embedding-3-large"


retrieval:
  strategy: "multi_hop"
  top_k: 10
  threshold: 0.3

  # Active multi-hop retrieval configuration. Use the same Llama checkpoint
  # for query rewriting as for the other generative/judging model roles.
  multi_hop:
    max_hops: 3
    accumulate_documents: true
    stop_if_no_new_documents: true

    query_rewriter:
      provider: "huggingface"
      model: "meta-llama/Llama-3.1-8B-Instruct"
      temperature: 0.0
      max_documents: 5
      max_chars_per_document: 1200


conformal:
  implementation: "aimal"
  aggregation_strategy: "max"
  scoring_strategy: "product"
  split_conformal: true

  alphas:
    start: 0.05
    end: 0.45
    step: 0.05

  a_value: 1.0
